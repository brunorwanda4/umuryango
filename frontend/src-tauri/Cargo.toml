[package]
name = "umuryango-native"
version = "0.1.0"
description = "Umuryango offline-first Tauri v2 application for Android and Windows"
authors = ["Umuryango Team"]
edition = "2021"

[lib]
name = "umuryango_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.6", features = [] }
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate", "chrono", "uuid", "json"] }
ring = "0.17.14"
sha2 = "0.11.1"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
thiserror = "2.0.21"
base64 = "0.22.1"
hex = "0.4.3"
zeroize = "1.9.1"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
